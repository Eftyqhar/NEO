[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-automation"
version = "0.1.0"
description = "Lightweight Real-Time CLI Workflow Automation Engine"
authors = [{ name = "Neo Contributors" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "aioimaplib>=1.0.0",
    "aiosmtplib>=3.0.0",
    "aiohttp>=3.9.0",
    "watchdog>=4.0.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
neo = "neo.cli:main"
