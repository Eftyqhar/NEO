name: "Fetch Real Email and Send Summary to Telegram"
description: "Fetches your actual latest email from Gmail, summarizes with AI, and sends to Telegram"
enabled: true

trigger:
  type: manual

steps:
  # 1. Connect to Gmail and fetch your latest real email
  - id: get_latest_email
    type: imap
    host: "imap.gmail.com"
    username: "{{ env.EMAIL_USER }}"
    password: "{{ env.EMAIL_PASS }}"
    folder: "INBOX"

  # 2. Summarize the REAL email with AI
  - id: summarize_email
    type: ai
    prompt: "Summarize the following email in 3 clear bullet points with any action items:"
    input: "From: {{ steps.get_latest_email.from }}\nSubject: {{ steps.get_latest_email.subject }}\nBody:\n{{ steps.get_latest_email.body }}"

  # 3. Send the REAL summary to your Telegram
  - id: send_to_telegram
    type: telegram
    bot_token: "{{ env.TELEGRAM_BOT_TOKEN }}"
    chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
    parse_mode: "Markdown"
    message: |
      📧 *Real Email Summary:*
      *From:* {{ steps.get_latest_email.from }}
      *Subject:* {{ steps.get_latest_email.subject }}

      {{ steps.summarize_email.output }}
